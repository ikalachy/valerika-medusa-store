version: "3.8"
services:
  postgres:
    image: postgres:10.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-docker
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persist database data in a volume

volumes:
  postgres-data:
    driver: local  # Default driver for persisting data locally
